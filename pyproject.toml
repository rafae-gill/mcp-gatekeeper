[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-gatekeeper"
version = "0.1.0"
description = "Per-person, per-tool, time-boxed, audited access to MCP servers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Rafae Gill" }]
keywords = ["mcp", "model-context-protocol", "authorization", "api-keys", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
# 1.10+ for stateless HTTP, which the example and the SDK tests use.
example = ["mcp>=1.10", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
dev = ["pytest>=8", "mcp>=1.10", "psycopg[binary]>=3.1", "psycopg-pool>=3.2"]

[tool.hatch.build.targets.wheel]
packages = ["mcp_gatekeeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
