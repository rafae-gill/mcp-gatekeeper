<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
  <title id="t">One shared warehouse MCP server, four people, different outcomes</title>
  <desc id="d">An analyst can query sales but is refused payroll. Finance can read payroll. An AI agent stuck in a loop is stopped by its calls-per-minute limit. A contractor is refused outside their hours. An admin grants the analyst payroll and the next call works with no redeploy. Every one of these lands in the audit log.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --dim:#59636e; --line:#d1d9e0; --box:#f6f8fa; --accent:#0969da;
            --ok:#1a7f37; --okbg:#dafbe1; --no:#cf222e; --nobg:#ffebe9; --warn:#9a6700; --warnbg:#fff8c5; --info:#0969da; --infobg:#ddf4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --dim:#9198a1; --line:#3d444d; --box:#151b23; --accent:#4493f8;
              --ok:#3fb950; --okbg:#0f2a19; --no:#ff7b72; --nobg:#3a1517; --warn:#d29922; --warnbg:#2e2410; --info:#4493f8; --infobg:#0c2d4b; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .title { font-size: 17px; font-weight: 600; }
    .sub { font-size: 12.5px; fill: var(--dim); }
    .who { font-size: 14px; font-weight: 600; }
    .key { font-size: 11.5px; fill: var(--dim); }
    .act { font-size: 13px; }
    .res { font-size: 12.5px; fill: var(--dim); }
    .colh { font-size: 11px; font-weight: 600; fill: var(--dim); letter-spacing: .05em; }
    .row { fill: var(--box); stroke: var(--line); stroke-width: 1; }
    .ok { fill: var(--okbg); stroke: var(--ok); } .okt { fill: var(--ok); font-size: 12px; font-weight: 700; }
    .no { fill: var(--nobg); stroke: var(--no); } .not { fill: var(--no); font-size: 12px; font-weight: 700; }
    .wa { fill: var(--warnbg); stroke: var(--warn); } .wat { fill: var(--warn); font-size: 12px; font-weight: 700; }
    .in { fill: var(--infobg); stroke: var(--info); } .int { fill: var(--info); font-size: 12px; font-weight: 700; }
    .audit { fill: var(--box); stroke: var(--accent); stroke-width: 1.2; }
    .tick { stroke: var(--line); stroke-width: 1; }
  </style>
  <rect width="900" height="560" style="fill: var(--bg)"/>

  <text class="title" x="20" y="34">One warehouse MCP server, shared by a team</text>
  <text class="sub" x="20" y="56">Same server, same tools. What each person can do comes from their own key, and changes without a redeploy.</text>

  <text class="colh" x="36" y="92">WHO · THEIR KEY</text>
  <text class="colh" x="330" y="92">TRIES TO</text>
  <text class="colh" x="600" y="92">RESULT</text>
  <line class="tick" x1="20" y1="100" x2="880" y2="100"/>

  <!-- row 1 -->
  <rect class="row" x="20" y="110" width="860" height="62" rx="8"/>
  <text class="who" x="36" y="135">Analyst</text>
  <text class="key" x="36" y="155">run_query · tables: sales, customers</text>
  <text class="act" x="330" y="146">"Total sales by region"</text>
  <rect class="ok" x="600" y="126" width="74" height="26" rx="13"/><text class="okt" x="637" y="144" text-anchor="middle">RUNS</text>
  <text class="res" x="688" y="144">gets the numbers</text>

  <!-- row 2 -->
  <rect class="row" x="20" y="180" width="860" height="62" rx="8"/>
  <text class="who" x="36" y="205">Analyst</text>
  <text class="key" x="36" y="225">same key</text>
  <text class="act" x="330" y="216">"Show me payroll"</text>
  <rect class="no" x="600" y="196" width="74" height="26" rx="13"/><text class="not" x="637" y="214" text-anchor="middle">DENIED</text>
  <text class="res" x="688" y="214">payroll isn't in their tables</text>

  <!-- row 3 -->
  <rect class="row" x="20" y="250" width="860" height="62" rx="8"/>
  <text class="who" x="36" y="275">Finance</text>
  <text class="key" x="36" y="295">run_query · tables: sales, payroll</text>
  <text class="act" x="330" y="286">"Show me payroll"</text>
  <rect class="ok" x="600" y="266" width="74" height="26" rx="13"/><text class="okt" x="637" y="284" text-anchor="middle">RUNS</text>
  <text class="res" x="688" y="284">their key allows it</text>

  <!-- row 4 -->
  <rect class="row" x="20" y="320" width="860" height="62" rx="8"/>
  <text class="who" x="36" y="345">Report bot (AI agent)</text>
  <text class="key" x="36" y="365">run_query · 30 calls/min · 4 at once</text>
  <text class="act" x="330" y="356">Stuck in a loop, 200 queries</text>
  <rect class="wa" x="600" y="336" width="74" height="26" rx="13"/><text class="wat" x="637" y="354" text-anchor="middle">LIMITED</text>
  <text class="res" x="688" y="354">stopped at 30 a minute</text>

  <!-- row 5 -->
  <rect class="row" x="20" y="390" width="860" height="62" rx="8"/>
  <text class="who" x="36" y="415">Contractor</text>
  <text class="key" x="36" y="435">run_query · 09:00–18:00, Mon–Fri</text>
  <text class="act" x="330" y="426">Any query at 2 am</text>
  <rect class="no" x="600" y="406" width="74" height="26" rx="13"/><text class="not" x="637" y="424" text-anchor="middle">DENIED</text>
  <text class="res" x="688" y="424">outside their hours</text>

  <!-- row 6 -->
  <rect class="row" x="20" y="460" width="860" height="62" rx="8"/>
  <text class="who" x="36" y="485">Admin</text>
  <text class="key" x="36" y="505">edits the Analyst's key</text>
  <text class="act" x="330" y="496">Adds payroll to their tables</text>
  <rect class="in" x="600" y="476" width="74" height="26" rx="13"/><text class="int" x="637" y="494" text-anchor="middle">LIVE</text>
  <text class="res" x="688" y="494">next call works, no redeploy</text>

  <text class="sub" x="20" y="548">Every query above is written to the audit log: who, which tool, when, and whether the gate let it through.</text>
</svg>
