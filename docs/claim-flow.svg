<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-labelledby="t d">
  <title id="t">Issuing a key with a claim link</title>
  <desc id="d">An admin creates an invite that stores only who it is for, what it may reach, and a hash of a one-time token. The link is emailed. The recipient signs in as the invited address and claims it; only then is the key minted, shown once, and stored as a hash. A usable secret exists nowhere until that moment.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --dim:#59636e; --line:#d1d9e0; --box:#f6f8fa; --accent:#0969da; --deny:#cf222e; --ok:#1a7f37; --warn:#9a6700; --okbg:#dafbe1; --warnbg:#fff8c5; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --dim:#9198a1; --line:#3d444d; --box:#151b23; --accent:#4493f8; --deny:#ff7b72; --ok:#3fb950; --warn:#d29922; --okbg:#0f2a19; --warnbg:#2e2410; }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: var(--dim); }
    .lbl { font-size: 12px; font-weight: 600; fill: var(--dim); letter-spacing: .04em; }
    .deny { font-size: 12px; fill: var(--deny); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.2; }
    .num { fill: var(--accent); }
    .numt { fill: #ffffff; font-size: 12px; font-weight: 700; }
    .arrow { stroke: var(--dim); stroke-width: 1.5; fill: none; marker-end: url(#a); }
    .tick { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
    .none { fill: var(--okbg); stroke: var(--ok); stroke-width: 1; }
    .once { fill: var(--warnbg); stroke: var(--warn); stroke-width: 1; }
    .nonet { font-size: 13px; font-weight: 600; fill: var(--ok); }
    .oncet { font-size: 13px; font-weight: 600; fill: var(--warn); }
    .head { fill: var(--dim); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect width="900" height="400" style="fill: var(--bg)"/>

  <!-- steps -->
  <g>
    <rect class="box" x="20" y="24" width="190" height="112" rx="8"/>
    <circle class="num" cx="42" cy="48" r="11"/><text class="numt" x="42" y="52" text-anchor="middle">1</text>
    <text class="h" x="62" y="53">Admin invites</text>
    <text class="s" x="34" y="80">Stores who it's for, what it</text>
    <text class="s" x="34" y="97">may reach, and sha256(token).</text>
    <text class="s" x="34" y="120">No key exists yet.</text>

    <path class="arrow" d="M210,80 L238,80"/>

    <rect class="box" x="240" y="24" width="190" height="112" rx="8"/>
    <circle class="num" cx="262" cy="48" r="11"/><text class="numt" x="262" y="52" text-anchor="middle">2</text>
    <text class="h" x="282" y="53">Link is emailed</text>
    <text class="s" x="254" y="80">Single-use, expires in 48 h.</text>
    <text class="s" x="254" y="97">Opening it shows who it's for,</text>
    <text class="s" x="254" y="114">not what it would reach.</text>

    <path class="arrow" d="M430,80 L458,80"/>

    <rect class="box" x="460" y="24" width="190" height="112" rx="8"/>
    <circle class="num" cx="482" cy="48" r="11"/><text class="numt" x="482" y="52" text-anchor="middle">3</text>
    <text class="h" x="502" y="53">Recipient signs in</text>
    <text class="s" x="474" y="80">Through your identity</text>
    <text class="s" x="474" y="97">provider. Must be the</text>
    <text class="s" x="474" y="114">invited address.</text>

    <path class="arrow" d="M650,80 L678,80"/>

    <rect class="box" x="680" y="24" width="200" height="112" rx="8"/>
    <circle class="num" cx="702" cy="48" r="11"/><text class="numt" x="702" y="52" text-anchor="middle">4</text>
    <text class="h" x="722" y="53">Key minted</text>
    <text class="s" x="694" y="80">In one transaction. Shown</text>
    <text class="s" x="694" y="97">once in their browser, stored</text>
    <text class="s" x="694" y="114">only as sha256(key).</text>
  </g>

  <!-- where does the secret exist -->
  <text class="lbl" x="20" y="182">WHERE DOES A USABLE SECRET EXIST?</text>
  <line class="tick" x1="20" y1="194" x2="880" y2="194"/>
  <rect class="none" x="20" y="206" width="190" height="40" rx="6"/>
  <text class="nonet" x="115" y="231" text-anchor="middle">nowhere</text>
  <rect class="none" x="240" y="206" width="190" height="40" rx="6"/>
  <text class="nonet" x="335" y="231" text-anchor="middle">nowhere (link ≠ key)</text>
  <rect class="none" x="460" y="206" width="190" height="40" rx="6"/>
  <text class="nonet" x="555" y="231" text-anchor="middle">nowhere</text>
  <rect class="once" x="680" y="206" width="200" height="40" rx="6"/>
  <text class="oncet" x="780" y="231" text-anchor="middle">one browser tab, once</text>

  <!-- failure branches -->
  <text class="lbl" x="20" y="292">WHAT GOES WRONG, AND WHAT HAPPENS</text>
  <line class="tick" x1="20" y1="304" x2="880" y2="304"/>
  <text class="deny" x="240" y="330">Link lost → revoke and re-issue.</text>
  <text class="s" x="240" y="348">There is no "resend": only the</text>
  <text class="s" x="240" y="365">hash was kept, so it can't be rebuilt.</text>
  <text class="deny" x="460" y="330">Forwarded → 403.</text>
  <text class="s" x="460" y="348">Signed in as someone else,</text>
  <text class="s" x="460" y="365">the link is useless.</text>
  <text class="deny" x="680" y="330">Second click → 409.</text>
  <text class="s" x="680" y="348">Two clicks at once still</text>
  <text class="s" x="680" y="365">mint exactly one key.</text>
  <text class="deny" x="20" y="330">Expired → 410.</text>
  <text class="s" x="20" y="348">Ask for a new invite.</text>
</svg>
