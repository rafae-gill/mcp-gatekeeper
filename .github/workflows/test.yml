name: tests

# Weekly as well as on push: the likeliest way for this library to break is the
# MCP SDK changing underneath it, and that happens without a commit here.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
        mcp: ["mcp", "mcp>=1.10,<2"]
    name: py${{ matrix.python }} / ${{ matrix.mcp }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]" "${{ matrix.mcp }}" --upgrade
      - run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - run: python -m pytest -q

  # The store contract against a real Postgres — in particular the concurrent
  # claim test, which only means something with real row locking.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      GK_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_store_contract.py
